<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css"> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&display=swap">
    <title>Document</title>
</head>
<body>
    <!-- Gallery Section -->
<section class="gallery" id="gallery">

    <h2>Our Heritage Gallery</h2>

    <p class="gallery-description">
        Explore the timeless beauty, historic monuments,
        traditional markets, and culture of Old City Hyderabad.
    </p>

    <div class="gallery-container">

        <!-- Image 1 -->
        <div class="gallery-item">
            <img src="images/images (3).jpeg" alt="Historic Charminar">
            <div class="gallery-overlay">
                <h3>Charminar</h3>
                <p>The iconic symbol of Hyderabad</p>
            </div>
        </div>

        <!-- Image 2 -->
        <div class="gallery-item">
            <img src="images/images (1).jpeg" alt="Makkah Masjid">
            <div class="gallery-overlay">
                <h3>Makkah Masjid</h3>
                <p>A historic architectural landmark</p>
            </div>
        </div>

        <!-- Image 3 -->
        <div class="gallery-item">
            <img src="images/images (2).jpeg" alt="Chowmahalla Palace">
            <div class="gallery-overlay">
                <h3>Chowmahalla Palace</h3>
                <p>A glimpse of royal heritage</p>
            </div>
        </div>
    </div>

</section>
       
    
</body>
</html>
